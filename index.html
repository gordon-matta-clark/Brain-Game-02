const brainImg=new Image();
let brainReady=false;
brainImg.onload=function(){brainReady=true; if(!running) draw();};
brainImg.src=BRAIN_SPRITE;

const bg=new Image();
const binImg=new Image();

bg.onload=function(){bgReady=true; if(!running) draw();};
binImg.onload=function(){binReady=true; if(!running) draw();};
bg.src=BG;
binImg.src=BIN;

let running=false, raf=0, last=0;
let score=0, lives=3, level=1, brainPower=100, timeLeft=60;
let binX=W/2, targetX=W/2;
let spawnTimer=.65, shake=0, combo=0, comboBest=0, caughtTotal=0, banner=0;
let particles=[];
let floaters=[];
let fever=0, feverFlash=0, glitch=0, pulseFX=0, totalCaught=0;
const falling=[];

const AudioContextClass=window.AudioContext||window.webkitAudioContext;
let audio=null;

function beep(freq,dur,type,vol){
  if(!audio) return;
  try{
    const osc=audio.createOscillator();
    const gain=audio.createGain();
    osc.type=type||"square";
    osc.frequency.setValueAtTime(freq,audio.currentTime);
    gain.gain.setValueAtTime(vol||0.03,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+dur);
    osc.connect(gain); gain.connect(audio.destination);
    osc.start(); osc.stop(audio.currentTime+dur);
  }catch(e){}
}

function unlockAudio(){
  if(!AudioContextClass) return;
  try{
    if(!audio) audio=new AudioContextClass();
    if(audio.state==="suspended") audio.resume();
  }catch(e){}
}

function setTarget(clientX){
  const r=canvas.getBoundingClientRect();
  if(!r.width) return;
  targetX=((clientX-r.left)/r.width)*W;
  targetX=Math.max(62,Math.min(W-62,targetX));
}

function pointerMove(e){
  setTarget(e.clientX);
  if(e.cancelable) e.preventDefault();
}
canvas.addEventListener("pointermove",pointerMove,{passive:false});
canvas.addEventListener("pointerdown",function(e){
  setTarget(e.clientX);
  if(!running) startGame();
  if(e.cancelable) e.preventDefault();
},{passive:false});


go.addEventListener("click",function(e){
  e.preventDefault();
  startGame();
});

function startGame(){
  unlockAudio();
  reset();
  running=true;
  startLayer.querySelector("h1").textContent="BRAIN INVADERS";
  startLayer.querySelector("p").textContent="CATCH THE BRAINS · 60 SEC · GO CRAZY";
  go.textContent="START";
  startLayer.style.display="none";
  last=performance.now();
  beep(440,.08,"square",.04);
  setTimeout(function(){beep(660,.08,"square",.035);},90);
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

function reset(){
  score=0; lives=3; level=1; brainPower=100; timeLeft=60;
  binX=W/2; targetX=W/2; spawnTimer=.5; shake=0; combo=0; comboBest=0; caughtTotal=0; banner=0;
  falling.length=0; particles.length=0; floaters.length=0; fever=0; feverFlash=0; glitch=0; pulseFX=0; totalCaught=0;
}

function makeBrain(){
  // Jedes Gehirn sieht gleich aus. Bei 20 % der Gehirne ist beim
  // Auffangen jedoch ein bewusst "falscher" / negativer Arcade-Ton hinterlegt.
  const negativeSound=Math.random()<0.20;
  falling.push({
    type:"brain",
    negativeSound,
    x:38+Math.random()*(W-76),
    y:-30,
    r:28,
    speed:(78+level*11+Math.random()*35)*(fever>0?1.55:1),
    phase:Math.random()*6.28,
    pulse:Math.random()*6.28
  });
}

function burst(x,y,good){
  const n=good?22:28;
  for(let j=0;j<n;j++){
    const a=Math.random()*Math.PI*2, sp=55+Math.random()*230;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-30,life:.45+Math.random()*.65,max:1.1,
      size:1.5+Math.random()*4,good});
  }
  floaters.push({x,y:y-8,text:good?"+BRAIN":"WRONG BRAIN!",life:.8,max:.8,good});
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=90*dt; p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i]; f.y-=42*dt; f.life-=dt;
    if(f.life<=0) floaters.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.save(); ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.good?'#ff2f70':'#39ff14';
    ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=10;
    ctx.fillRect(p.x,p.y,p.size,p.size); ctx.restore();
  }
}

function drawFloaters(){
  for(const f of floaters){
    ctx.save(); ctx.globalAlpha=Math.max(0,f.life/f.max);
    ctx.font="900 12px Arial"; ctx.textAlign="center";
    ctx.fillStyle=f.good?"#ffffff":"#39ff14";
    ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=16;
    ctx.fillText(f.text,f.x,f.y); ctx.restore();
  }
}

function drawCrazyFX(t){
  // Animated neon arcade border
  const p=(Math.sin(t*5)+1)/2;
  ctx.save();
  ctx.strokeStyle=`rgba(255,36,85,${.55+.35*p})`; ctx.lineWidth=3+p*3;
  ctx.shadowColor="#ff2455"; ctx.shadowBlur=14+p*18;
  ctx.strokeRect(3,3,W-6,H-6);
  // moving vertical energy rails
  for(let i=0;i<5;i++){
    const x=((t*(35+i*9)+i*113)%(W+80))-40;
    const g=ctx.createLinearGradient(x-20,0,x+20,0); g.addColorStop(0,"transparent"); g.addColorStop(.5,i%2?"#39ff14aa":"#ff2f70aa"); g.addColorStop(1,"transparent");
    ctx.fillStyle=g; ctx.fillRect(x-20,0,40,H);
  }
  // fever rings
  if(fever>0){
    ctx.globalAlpha=.5; ctx.strokeStyle="#39ff14"; ctx.shadowColor="#39ff14"; ctx.shadowBlur=25;
    for(let i=0;i<3;i++){ const r=95+i*45+Math.sin(t*7+i)*12; ctx.beginPath(); ctx.arc(W/2,480,r,0,Math.PI*2); ctx.stroke(); }
  }
  // occasional glitch bars
  if(glitch>0){
    ctx.globalAlpha=.28;
    for(let i=0;i<7;i++){ const y=Math.random()*H; ctx.fillStyle=i%2?"#ff2455":"#39ff14"; ctx.fillRect(0,y,W,2+Math.random()*6); }
  }
  ctx.restore();
}

function caught(i){
  const item=falling[i];
  falling.splice(i,1);
  caughtTotal++; totalCaught++;
  combo++;
  if(combo>=10 && fever<=0){ fever=5.5; feverFlash=1; glitch=.8; pulseFX=1; beep(110,.08,"sawtooth",.04); setTimeout(()=>beep(220,.08,"square",.04),70); setTimeout(()=>beep(440,.12,"square",.045),140); }
  comboBest=Math.max(comboBest,combo);
  const mult=Math.min(5,1+Math.floor(combo/5));
  score += 100*level*mult*(fever>0?2:1);
        if(window.brainCaught) window.brainCaught(false);
  brainPower=Math.min(100,brainPower+2);
  banner=0.65;
  burst(item.x,item.y,!item.negativeSound);
  if(combo%5===0){
    beep(760,.05,"square",.04);
    setTimeout(()=>beep(980,.06,"square",.035),55);
    setTimeout(()=>beep(1240,.08,"square",.03),115);
  }
  if(item.negativeSound){
    shake=4;
    beep(260,.12,"sawtooth",.045);
    setTimeout(function(){beep(145,.20,"square",.04);},75);
  } else {
    beep(560,.05,"square",.045);
    setTimeout(function(){beep(840,.06,"square",.025);},30);
  }
}
function missed(i){
  falling.splice(i,1);
  combo=0;
  lives--;
  brainPower=Math.max(0,brainPower-15);
  shake=8;
  beep(95,.12,"sawtooth",.045);
  if(lives<=0||brainPower<=0) endGame();
}

function gameOverFanfare(){
  if(!audio) return;
  const notes=[523,659,784,1047,784,659,523];
  notes.forEach((f,i)=>{
    setTimeout(()=>beep(f,0.16,"square",0.045),i*145);
  });
  setTimeout(()=>beep(392,0.45,"sawtooth",0.035),notes.length*145);
}
function endGame(){
  running=false;
  startLayer.style.display="flex";
  startLayer.querySelector("h1").textContent="GAME OVER";
  startLayer.querySelector("p").textContent="BETTER USE YOUR OWN BRAIN · TIME UP · SCORE "+String(score).padStart(6,"0");
  go.textContent="NOCHMAL";
  gameOverFanfare();
}

function update(dt){
  timeLeft-=dt;
  if(timeLeft<=0){
    timeLeft=0;
    endGame();
    return;
  }
  if(fever>0) fever-=dt;
  if(feverFlash>0) feverFlash-=dt;
  if(glitch>0) glitch-=dt;
  if(pulseFX>0) pulseFX-=dt;
  level=Math.min(12,1+Math.floor((60-timeLeft)/6)+Math.floor(score/1800));
  spawnTimer-=dt;
  if(spawnTimer<=0){
    makeBrain();
    spawnTimer=Math.max(.16,.74-level*.035)*(fever>0?.68:1);
  }

  binX += (targetX-binX)*Math.min(1,dt*14);

  const binY=900, binW=94, binH=64;
  for(let i=falling.length-1;i>=0;i--){
    const b=falling[i];
    b.y += b.speed*dt;
    b.phase += dt*4;
    b.pulse += dt*5;

    const hitY=b.y+b.r >= binY-binH/2 && b.y-b.r <= binY+binH/2;
    const hitX=Math.abs(b.x-binX) <= binW/2+b.r*.85;
    if(hitY && hitX){ caught(i); continue; }

    if(b.y-b.r>H-20) missed(i);
  }
  updateParticles(dt);
  if(banner>0) banner-=dt;
  if(shake>0) shake*=.84;
}

function txt(s,x,y,size,align,fill){
  ctx.font="900 "+size+"px Arial,Helvetica,sans-serif";
  ctx.textAlign=align||"left";
  ctx.textBaseline="alphabetic";
  ctx.fillStyle=fill||"#fff";
  ctx.fillText(s,x,y);
}

function drawBrain(b){
  if(!brainReady) return;
  const brainW=62, brainH=74;
  const pulse=1+Math.sin(b.pulse)*0.025;
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.rotate(Math.sin(b.phase)*0.025);
  ctx.scale(pulse,pulse);
  const col=b.negativeSound ? "#39ff14" : "#ff2f70";
  ctx.shadowColor=col;
  ctx.shadowBlur=b.negativeSound ? 32 : 24;
  ctx.drawImage(brainImg,-brainW/2,-brainH/2,brainW,brainH);
  ctx.globalAlpha=.28;
  ctx.strokeStyle=col; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(0,0,brainW*.52,brainH*.53,0,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}
function drawBin(){
  const x=binX,y=903;
  const iw=92, ih=80;
  if(binReady){
    ctx.save();
    ctx.imageSmoothingEnabled=false;
    ctx.shadowColor="#fff";
    ctx.shadowBlur=8;
    ctx.drawImage(binImg,x-iw/2,y-ih/2,iw,ih);
    ctx.restore();
  } else {
    // Fallback, falls die Referenzgrafik noch lädt.
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle="#eee"; ctx.strokeStyle="#111"; ctx.lineWidth=4;
    ctx.fillRect(-45,-32,90,64); ctx.strokeRect(-45,-32,90,64);
    ctx.fillRect(-50,-41,100,9); ctx.strokeRect(-50,-41,100,9);
    ctx.strokeStyle="#555"; ctx.lineWidth=3;
    for(let i=-30;i<=30;i+=15){ctx.beginPath();ctx.moveTo(i,-24);ctx.lineTo(i,25);ctx.stroke();}
    ctx.restore();
  }
}

function drawBackground(){
  if(bgReady){
    const iw=bg.naturalWidth||600, ih=bg.naturalHeight||1067;
    const scale=Math.max(W/iw,H/ih);
    const dw=iw*scale, dh=ih*scale;
    ctx.drawImage(bg,(W-dw)/2,(H-dh)/2,dw,dh);
  } else {
    ctx.fillStyle="#252027"; ctx.fillRect(0,0,W,H);
  }
  ctx.fillStyle="rgba(0,0,0,.38)"; ctx.fillRect(0,0,W,H);
}

function draw(t){
  ctx.save();
  if(shake>1) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawBackground();
  drawCrazyFX(t/1000);
  if(feverFlash>0){ ctx.fillStyle="rgba(57,255,20,"+(feverFlash*.18)+")"; ctx.fillRect(0,0,W,H); }
  if(pulseFX>0){ ctx.fillStyle="rgba(255,36,85,"+(pulseFX*.08)+")"; ctx.fillRect(0,0,W,H); }

  // CRT / neon treatment
  ctx.fillStyle="rgba(255,0,65,.045)"; ctx.fillRect(0,0,W,H);
  for(let y=0;y<H;y+=5){ ctx.fillStyle="rgba(0,0,0,.11)"; ctx.fillRect(0,y,W,1); }

  // premium arcade HUD
  ctx.fillStyle="rgba(4,4,8,.82)"; ctx.fillRect(0,0,W,64);
  ctx.fillStyle="#ff2455"; ctx.fillRect(16,53,W-32,3);
  txt("SCORE",18,22,11,"left","#fff");
  txt(String(score).padStart(6,"0"),18,46,18,"left","#ff2455");
  txt("LEVEL",158,22,11,"left","#fff");
  txt(String(level).padStart(2,"0"),158,46,18,"left","#ff2455");
  txt("TIME",266,22,11,"left","#fff");
  txt(String(Math.ceil(timeLeft)).padStart(2,"0"),266,46,18,"left",timeLeft<=10?"#39ff14":"#ff2455");
  txt("BRAIN",366,22,11,"left","#fff");
  txt(Math.round(brainPower)+"%",366,46,18,"left","#ff2455");
  txt("♥".repeat(lives),520,30,18,"right","#ff2455");

  // brain power meter
  ctx.fillStyle="#15151b"; ctx.fillRect(18,59,W-36,3);
  ctx.fillStyle="#ff2455"; ctx.fillRect(18,59,(W-36)*brainPower/100,3);

  for(const b of falling) drawBrain(b);
  drawParticles();
  drawFloaters();
  drawBin();
  if(fever>0){
    ctx.save(); ctx.globalAlpha=.92;
    txt("⚡ BRAIN FEVER ⚡",W/2,104,20,"center","#39ff14");
    txt("2X SCORE · GO CRAZY",W/2,124,10,"center","#ffffff");
    ctx.restore();
  }

  if(combo>=2 && banner>0){
    const mult=Math.min(5,1+Math.floor(combo/5));
    ctx.save();
    ctx.globalAlpha=Math.min(1,banner*2);
    txt(combo+"x CATCH STREAK",W/2,720,18,"center","#fff");
    txt("x"+mult+" SCORE",W/2,745,12,"center","#ff2f70");
    ctx.restore();
  }


  ctx.restore();
}
function loop(now){
  if(!running) return;
  const dt=Math.min(.035,Math.max(0,(now-last)/1000));
  last=now;
  update(dt);
  draw(now);
  raf=requestAnimationFrame(loop);
}

draw(0);
})();
</script>

<div id="crazy-event"><div class="big"></div><div class="small"></div></div>
<div id="logic-meter"><i></i></div>

<script id="crazy-logic">
(function(){
  const ev=document.getElementById('crazy-event');
  const meter=document.querySelector('#logic-meter i');
  if(!ev) return;

  let logic=0, streak=0, lastGood=0, eventTimer=0;
  const normalTitle=["BRAIN SYNC","THOUGHT RECOVERED","CORTEX ONLINE","NEURAL DELIVERY"];
  const badTitle=["WRONG BRAIN","THOUGHT CORRUPTED","DO NOT TRUST THIS BRAIN","GREEN MEANS NOPE"];
  const feverTitle=["BRAIN FEVER","CORTEX OVERDRIVE","USE YOUR OWN BRAIN","REALITY BUFFER FULL"];

  function tone(freq,dur,type='square',gain=.035){
    try{
      const C=window.AudioContext||window.webkitAudioContext;
      if(!C)return;
      const c=window.__crazyAudio||(window.__crazyAudio=new C());
      if(c.state==='suspended') c.resume();
      const o=c.createOscillator(),g=c.createGain();
      o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
      o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+dur);
    }catch(e){}
  }
  function show(title,sub,color){
    ev.style.color=color; ev.querySelector('.big').textContent=title;
    ev.querySelector('.small').textContent=sub;
    ev.classList.add('show'); clearTimeout(eventTimer);
    eventTimer=setTimeout(()=>ev.classList.remove('show'),650);
  }
  function syncMeter(){meter.style.width=Math.min(100,logic)+'%';}

  // Public hook for the game: call window.brainCaught(isBad)
  window.brainCaught=function(isBad){
    if(isBad){
      streak=0; logic=Math.max(0,logic-28); syncMeter();
      show(badTitle[Math.floor(Math.random()*badTitle.length)],
           "NEON-GRÜN = FINGER WEG","lime");
      tone(145,.22,'sawtooth',.06); setTimeout(()=>tone(90,.24,'sawtooth',.05),90);
      return;
    }
    streak++;
    logic=Math.min(100,logic+9+Math.min(8,streak));
    syncMeter();
    if(streak===3){show("3× BRAIN","NEURAL CHAIN","hotpink");tone(520,.08);tone(680,.08);}
    if(streak===5){show("5× BRAIN","CORTEX COMBO","hotpink");tone(620,.08);tone(820,.1);}
    if(streak===7){show("7× BRAIN","THOUGHTS ARE FLYING","white");tone(720,.07);tone(920,.07);tone(1120,.09);}
    if(streak===10){
      show("BRAIN FEVER","USE YOUR OWN BRAIN","lime");
      logic=100;syncMeter();
      for(let i=0;i<4;i++) setTimeout(()=>tone(500+i*170,.09,'square',.045),i*65);
    }
    if(streak>10 && streak%5===0){
      show(feverTitle[Math.floor(Math.random()*feverTitle.length)],
           "LOGIK ≠ LANGWEILIG","lime");
      tone(900,.06);tone(1200,.08);
    }
  };
})();
</script>
